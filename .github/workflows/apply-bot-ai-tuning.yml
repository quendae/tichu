name: Apply Bot AI Tuning

on:
  push:
    branches:
      - feature/bot-ai-v1
    paths:
      - .github/workflows/apply-bot-ai-tuning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bot-ai-v1
          fetch-depth: 0
      - run: python scripts/patch-bot-tuning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot-strategy.js
          git diff --cached --check
          git commit -m "fix: tune strategic Tichu declarations and partner play"
          git push origin HEAD:feature/bot-ai-v1
