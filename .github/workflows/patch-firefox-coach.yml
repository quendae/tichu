name: Patch Firefox Coach

on:
  push:
    branches:
      - feature/cross-browser-device-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: stabilize Coach across async renders'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cross-browser-device-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch-firefox-coach-render.py
      - run: npm install
      - run: npm test
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui-render.js
          git commit -m 'fix: stabilize Coach across async renders'
          git push origin HEAD:feature/cross-browser-device-acceptance
