name: Bot AI v2 Apply

on:
  push:
    branches:
      - feature/bot-ai-v2
    paths:
      - .github/workflows/bot-ai-v2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bot-ai-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/apply-v2-benchmark-patch.py
      - run: node --test tests/bot-benchmark.test.mjs tests/simulation-driver.test.mjs tests/bot-strategy-tuning.test.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/driver.js src/simulation/bot-benchmark.js scripts/benchmark-bots.mjs package.json
          git commit -m "feat: benchmark strategic v2 against frozen v1"
          git push origin HEAD:feature/bot-ai-v2
