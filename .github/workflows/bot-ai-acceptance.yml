name: Bot AI Acceptance

on:
  push:
    branches:
      - feature/bot-ai-v1
    paths:
      - .github/workflows/bot-ai-acceptance.yml

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run 400-match Bot AI acceptance gate on untouched seed block
        run: node scripts/benchmark-bots.mjs --pairs 200 --seed 20001 --validate --git-sha "${{ github.sha }}"
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-ai-acceptance-20001
          path: artifacts/bot-benchmarks/**
          if-no-files-found: error
