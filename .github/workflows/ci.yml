name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run test:sim
      - run: npm run test:bot-benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Live multiplayer E2E
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run test:e2e:multiplayer
      - name: Upload UI, multiplayer, and benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-test-artifacts
          path: |
            test-results/*.png
            test-results-multiplayer/**
            artifacts/bot-benchmarks/**
          if-no-files-found: ignore

  multiplayer-full-match:
    if: github.ref == 'refs/heads/feature/multiplayer-full-match-acceptance'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 4h
            script: test:e2e:multiplayer:match
          - name: 2h2b
            script: test:e2e:multiplayer:match:2h2b
          - name: takeover
            script: test:e2e:multiplayer:match:takeover
    name: multiplayer-full-match-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.script }}
      - name: Upload full-match diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-full-match-${{ matrix.name }}-artifacts
          path: test-results-multiplayer/**
          if-no-files-found: ignore

  multiplayer-edge-cases:
    if: github.ref == 'refs/heads/feature/multiplayer-edge-cases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:multiplayer:edges
      - name: Upload edge-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-multiplayer-edge-artifacts
          path: test-results-multiplayer/**
          if-no-files-found: ignore

  cross-browser-ui:
    if: github.ref == 'refs/heads/feature/cross-browser-device-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:cross-browser
      - name: Upload cross-browser UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-cross-browser-ui-artifacts
          path: test-results-cross-browser/**
          if-no-files-found: ignore

  cross-browser-multiplayer:
    if: github.ref == 'refs/heads/feature/cross-browser-device-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:multiplayer:cross-browser
      - name: Upload cross-browser multiplayer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tichu-cross-browser-multiplayer-artifacts
          path: test-results-cross-browser-multiplayer/**
          if-no-files-found: ignore