<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <title>Tichu · QQND</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./concept-polish.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-word">TICHU</span>
        <small>GRAJ · MYŚL · RAZEM</small>
      </div>
      <div class="scoreboard" aria-label="Wynik meczu">
        <div class="score-team score-team-a"><small id="team-a-label">MY</small><strong id="score-a">0</strong></div>
        <span class="score-seal">天</span>
        <div class="score-team score-team-b"><small id="team-b-label">ONI</small><strong id="score-b">0</strong></div>
      </div>
      <div class="top-actions compact-actions" aria-label="Szybkie akcje">
        <button data-action="open-log" class="icon-ghost" title="Historia" aria-label="Historia">☷</button>
        <button data-action="open-multiplayer" class="icon-ghost" title="Gra online" aria-label="Gra online">◎</button>
      </div>
    </header>

    <nav class="table-menu" aria-label="Menu gry">
      <div class="menu-brand"><b>TICHU</b><small>QQND CARD TABLE</small></div>
      <button data-action="new-match" class="menu-button"><span>↻</span><b>Nowa gra</b></button>
      <button data-action="open-rules" class="menu-button"><span>▣</span><b>Zasady</b></button>
      <button data-action="coach-toggle" class="menu-button coach-menu active"><span>🎓</span><b>Tryb początkującego</b><i id="coach-menu-state">ON</i></button>
      <button data-action="open-multiplayer" class="menu-button"><span>⌁</span><b>Online</b></button>
      <button data-action="open-log" class="menu-button"><span>☷</span><b>Historia</b></button>
    </nav>

    <main class="table-shell">
      <div class="scene-backdrop" aria-hidden="true">
        <div class="mountain mountain-a"></div>
        <div class="mountain mountain-b"></div>
        <div class="pagoda-silhouette"></div>
        <div class="blossom blossom-a"></div>
        <div class="blossom blossom-b"></div>
      </div>

      <section class="table" aria-label="Stół do Tichu">
        <div class="table-brass table-brass-left" aria-hidden="true"></div>
        <div class="table-brass table-brass-right" aria-hidden="true"></div>
        <div class="felt-pattern" aria-hidden="true"></div>
        <div class="felt-dragon" aria-hidden="true">龍</div>

        <div class="seat seat-top" data-seat="2"></div>
        <div class="seat seat-left" data-seat="1"></div>
        <div class="seat seat-right" data-seat="3"></div>

        <aside class="table-quote" aria-hidden="true">„Dobra drużyna<br>widzi więcej.”</aside>

        <div class="center">
          <div id="wish-chip" class="wish-chip hidden"></div>
          <div id="context-panel" class="context-panel" aria-live="polite"></div>
          <div id="table-pile" class="table-pile"></div>
          <div id="wish-bar" class="wish-bar hidden"></div>
          <div id="turn-status" class="turn-status" aria-live="polite"></div>
          <div class="table-actions">
            <button data-action="pass" id="pass-btn" class="secondary action-pass" disabled>Spasuj</button>
            <button data-action="call-tichu" id="tichu-btn" class="secondary action-tichu">Tichu +100</button>
            <button data-action="play" id="play-btn" class="primary action-play" disabled>Zagraj</button>
          </div>
          <div id="round-summary" class="round-summary hidden"></div>
        </div>

        <div id="coach-panel" class="coach-dock" aria-live="polite"></div>
        <div class="seat seat-bottom" data-seat="0"></div>
      </section>
    </main>

    <aside id="log-panel" class="drawer hidden">
      <div class="drawer-head"><h2>Historia gry</h2><button data-action="close-drawer" aria-label="Zamknij historię">×</button></div>
      <div id="game-log" class="log-list"></div>
    </aside>

    <footer class="statusbar">
      <span>Tichu v0.2.0</span><i></i><span id="mode-status">Gra lokalna · 3 boty</span>
      <span class="status-spacer"></span>
      <span id="coach-status">🎓 Coach: ON</span><i></i><span id="round-status">Runda 1</span><i></i><span id="turn-status-footer">Twój ruch</span>
    </footer>

    <div id="modal-root"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="./src/ui.js"></script>
</body>
</html>
